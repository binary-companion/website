name: Deploy website
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sign in to Google Cloud without a stored key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/948864622857/locations/global/workloadIdentityPools/github/providers/website
          service_account: website-deploy@binary-companion.iam.gserviceaccount.com
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.33.0 deploy --only hosting --project binary-companion --non-interactive
